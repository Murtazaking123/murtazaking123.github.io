<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pakistan Calculators – Zakat, Bijli Bill, Tola, Loan EMI</title>
<meta name="description" content="Free Pakistan calculators: zakat, bijli bill, tola converter and loan EMI. English and Urdu.">
<style>
:root{--bg:#f4f6f5;--card:#fff;--fg:#14211b;--mut:#66756d;--line:#dbe3de;--acc:#0b7a4b;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#16201b;--fg:#e8f0eb;--mut:#8da197;--line:#27352e;--acc:#34c27f;--accfg:#06150e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#16201b;--fg:#e8f0eb;--mut:#8da197;--line:#27352e;--acc:#34c27f;--accfg:#06150e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI","Noto Naskh Arabic",Helvetica,Arial,sans-serif;line-height:1.5}
html[dir=rtl] body{line-height:1.9}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:22px;margin:0}
.sub{color:var(--mut);font-size:14px;margin:4px 0 14px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav a{white-space:nowrap;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font-size:14px}
nav a.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
section{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
section.on{display:block}
label{display:block;margin-bottom:12px;font-size:13px;color:var(--mut)}
input,select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.out{margin-top:6px;border-top:1px dashed var(--line);padding-top:10px}
.r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
.r b{font-variant-numeric:tabular-nums}
.big{font-size:18px;color:var(--acc)}
.note{margin-top:14px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 data-k="title"></h1><button class="lang" id="lang">اردو</button></div>
  <p class="sub" data-k="sub"></p>
  <nav id="nav"></nav>

  <section id="p-zakat">
    <label><span data-k="cash"></span><input id="z1" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="gold"></span><input id="z2" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="goldp"></span><input id="z3" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="silver"></span><input id="z4" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="silverp"></span><input id="z5" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="biz"></span><input id="z6" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="recv"></span><input id="z7" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="debt"></span><input id="z8" type="number" inputmode="decimal" min="0"></label>
    <div class="out" id="o-zakat"></div>
    <p class="note" data-k="znote"></p>
  </section>

  <section id="p-bijli">
    <label><span data-k="units"></span><input id="b1" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="rate"></span><input id="b2" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="fixed"></span><input id="b3" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="tax"></span><input id="b4" type="number" inputmode="decimal" min="0"></label>
    <div class="out" id="o-bijli"></div>
    <p class="note" data-k="note"></p>
  </section>

  <section id="p-tola">
    <label><span data-k="val"></span><input id="t1" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="unit"></span>
      <select id="t2"><option value="11.664" data-k="tola"></option><option value="0.972" data-k="masha"></option><option value="0.1215" data-k="ratti"></option><option value="1" data-k="gram"></option><option value="1000" data-k="kg"></option></select></label>
    <div class="out" id="o-tola"></div>
  </section>

  <section id="p-emi">
    <label><span data-k="prin"></span><input id="e1" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="ar"></span><input id="e2" type="number" inputmode="decimal" min="0"></label>
    <label><span data-k="mon"></span><input id="e3" type="number" inputmode="numeric" min="1"></label>
    <div class="out" id="o-emi"></div>
    <p class="note" data-k="note"></p>
  </section>
</div>
<script>
var T={en:{title:"Pakistan Calculators",sub:"Free zakat, bijli bill, tola and loan calculators",
n_zakat:"Zakat",n_bijli:"Bijli Bill",n_tola:"Tola Converter",n_emi:"Loan EMI",
cash:"Cash and bank savings (Rs)",gold:"Gold weight (tola)",goldp:"Gold price per tola (Rs)",silver:"Silver weight (tola)",silverp:"Silver price per tola (Rs)",biz:"Business goods and stock (Rs)",recv:"Money owed to you (Rs)",debt:"Debts you owe (Rs)",
total:"Total zakatable wealth",nisab:"Nisab (silver, 52.5 tola)",zakat:"Zakat due (2.5%)",below:"Your wealth is below nisab, so no zakat is due.",
znote:"Enter today’s gold and silver prices. Views differ on some points, so please confirm with a scholar.",
units:"Units used (kWh)",rate:"Rate per unit (Rs)",fixed:"Fixed charges (Rs)",tax:"Taxes (%)",energy:"Energy charges",taxamt:"Tax amount",bill:"Estimated bill",
note:"Estimates only. Rates change, so check your official bill.",
val:"Value",unit:"Unit",tola:"Tola",masha:"Masha",ratti:"Ratti",gram:"Gram",kg:"Kg",
prin:"Loan amount (Rs)",ar:"Yearly interest rate (%)",mon:"Months",emi:"Monthly instalment",totp:"Total payable",int:"Total interest"},
ur:{title:"پاکستان کیلکولیٹرز",sub:"مفت زکوٰۃ، بجلی بل، تولہ اور قسط کیلکولیٹر",
n_zakat:"زکوٰۃ",n_bijli:"بجلی بل",n_tola:"تولہ کنورٹر",n_emi:"قسط (EMI)",
cash:"نقد اور بینک رقم (روپے)",gold:"سونا (تولہ)",goldp:"سونے کی قیمت فی تولہ (روپے)",silver:"چاندی (تولہ)",silverp:"چاندی کی قیمت فی تولہ (روپے)",biz:"کاروباری مال (روپے)",recv:"وصول طلب رقم (روپے)",debt:"آپ کے ذمے قرض (روپے)",
total:"کل قابل زکوٰۃ مال",nisab:"نصاب (چاندی، 52.5 تولہ)",zakat:"واجب زکوٰۃ (2.5%)",below:"آپ کا مال نصاب سے کم ہے، زکوٰۃ واجب نہیں۔",
znote:"آج کے سونے اور چاندی کے ریٹ لکھیں۔ بعض مسائل میں اختلاف ہے، اس لیے عالم سے تصدیق کر لیں۔",
units:"استعمال شدہ یونٹ",rate:"فی یونٹ ریٹ (روپے)",fixed:"فکسڈ چارجز (روپے)",tax:"ٹیکس (%)",energy:"بجلی کے چارجز",taxamt:"ٹیکس کی رقم",bill:"اندازاً بل",
note:"یہ صرف اندازہ ہے۔ ریٹ بدلتے رہتے ہیں، سرکاری بل سے تصدیق کریں۔",
val:"مقدار",unit:"یونٹ",tola:"تولہ",masha:"ماشہ",ratti:"رتی",gram:"گرام",kg:"کلو",
prin:"قرض کی رقم (روپے)",ar:"سالانہ شرح سود (%)",mon:"مہینے",emi:"ماہانہ قسط",totp:"کل ادائیگی",int:"کل سود"}};
var L="en",tools=["zakat","bijli","tola","emi"];
function t(k){return T[L][k]}
function n(id){return parseFloat(document.getElementById(id).value)||0}
function f(x){return Math.round(x).toLocaleString("en-PK")}
function row(k,v,c){return '<div class="r'+(c?' big':'')+'"><span>'+t(k)+'</span><b>'+v+'</b></div>'}
function calc(){
  var tot=n("z1")+n("z2")*n("z3")+n("z4")*n("z5")+n("z6")+n("z7")-n("z8"),nis=52.5*n("z5"),h=row("total","Rs "+f(Math.max(tot,0)));
  if(nis>0)h+=row("nisab","Rs "+f(nis));
  if(nis>0&&tot>=nis)h+=row("zakat","Rs "+f(tot*.025),1);else if(nis>0&&tot>0)h+='<div class="r"><span>'+t("below")+'</span></div>';
  document.getElementById("o-zakat").innerHTML=h;
  var en=n("b1")*n("b2"),sub=en+n("b3"),tx=sub*n("b4")/100;
  document.getElementById("o-bijli").innerHTML=row("energy","Rs "+f(en))+row("taxamt","Rs "+f(tx))+row("bill","Rs "+f(sub+tx),1);
  var g=n("t1")*parseFloat(document.getElementById("t2").value),o="";
  [["tola",11.664],["masha",.972],["ratti",.1215],["gram",1],["kg",1000]].forEach(function(u){o+=row(u[0],(g/u[1]).toLocaleString("en-PK",{maximumFractionDigits:3}))});
  document.getElementById("o-tola").innerHTML=o;
  var P=n("e1"),r=n("e2")/1200,m=Math.round(n("e3")),e=0;
  if(P>0&&m>0)e=r?P*r*Math.pow(1+r,m)/(Math.pow(1+r,m)-1):P/m;
  document.getElementById("o-emi").innerHTML=row("emi","Rs "+f(e),1)+row("totp","Rs "+f(e*m))+row("int","Rs "+f(Math.max(e*m-P,0)))}
function text(){
  [].forEach.call(document.querySelectorAll("[data-k]"),function(e){e.textContent=t(e.getAttribute("data-k"))});
  document.getElementById("nav").innerHTML=tools.map(function(k){return '<a href="#'+k+'" id="n-'+k+'">'+t("n_"+k)+'</a>'}).join("");
  document.documentElement.lang=L;document.documentElement.dir=L=="ur"?"rtl":"ltr";
  document.getElementById("lang").textContent=L=="en"?"اردو":"English";
  route();calc()}
function route(){
  var h=location.hash.slice(1);if(tools.indexOf(h)<0)h="zakat";
  tools.forEach(function(k){document.getElementById("p-"+k).classList.toggle("on",k==h);var a=document.getElementById("n-"+k);if(a)a.classList.toggle("on",k==h)})}
document.getElementById("lang").onclick=function(){L=L=="en"?"ur":"en";text()};
document.addEventListener("input",calc);
window.addEventListener("hashchange",route);
text();
</script>
</body>
</html>
